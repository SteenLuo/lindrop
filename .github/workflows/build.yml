name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: '386'
            label: x86
          - goarch: amd64
            label: x64
    env:
      GOOS: windows
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - name: Test and build
        shell: pwsh
        run: ./build.ps1 -Architecture $env:GOARCH
      - name: Package
        shell: pwsh
        run: |
          $package = 'dist/LinDrop-0.7.5-windows-${{ matrix.label }}'
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item -LiteralPath '邻传.exe','LICENSE','THIRD_PARTY_LICENSE.txt','GO-LICENSE.txt','SHA256-JS-LICENSE.txt' -Destination $package
          Copy-Item -LiteralPath docs/usage.txt -Destination "$package/使用说明.txt"
          Copy-Item -LiteralPath docs/verification.txt -Destination "$package/验证说明.txt"
          Get-ChildItem $package -File | Where-Object Name -ne SHA256.txt | ForEach-Object { '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash,$_.Name } | Set-Content -Encoding utf8 "$package/SHA256.txt"
          Compress-Archive -Path $package -DestinationPath "$package.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: LinDrop-0.7.5-windows-${{ matrix.label }}
          path: dist/LinDrop-0.7.5-windows-${{ matrix.label }}.zip
