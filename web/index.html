<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>邻传 · 对话</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="app-shell">
<header class="chat-header"><span class="brand" aria-label="邻传">↔</span><select id="peerSelect" aria-label="选择对话设备"><option>连接中…</option></select><span id="linkState" class="state">连接中</span><button id="profileToggle" class="icon-button" aria-label="我的设备名称" title="我的设备名称">⋯</button></header>
<div id="profilePanel" class="profile-panel" hidden><label for="myName">手机名称</label><input id="myName" maxlength="30" placeholder="例如：我的手机"><button id="saveName">保存</button><small id="profileHint" hidden>首次连接可沿用局域网里的手机名，或输入新名称。请选择你自己的手机。</small><button id="findPhoneNames" type="button">沿用局域网名称</button><div id="phoneNameChoices" class="phone-name-choices" hidden><select id="knownPhoneName" aria-label="局域网已登记的手机名称"></select><button id="usePhoneName" type="button">使用名称</button></div><fieldset class="notice-preferences"><legend>消息提醒 · 自动保存</legend><label><input id="noticeBanner" type="checkbox" checked>页面提示</label><label><input id="noticeVibrate" type="checkbox" checked>振动</label><label><input id="noticeBadges" type="checkbox" checked>设备未读数</label><label><input id="noticeTitle" type="checkbox" checked>标题未读数</label></fieldset></div>
<main id="messages" class="messages" role="log" aria-label="对话记录" aria-live="polite"></main>
<div id="progress" class="transfer-tray" hidden><div class="progress-label"><span id="jobLabel"></span><button id="pause">暂停</button></div><div class="bar"><i id="bar"></i></div><p id="progressText"></p></div>
<form id="textSendForm" class="composer"><div class="attach-wrap"><button id="attachToggle" type="button" class="attach-button" aria-label="添加文件">＋</button><div id="attachMenu" class="attach-menu" hidden><button id="choose" type="button">文件</button><button id="chooseFolder" type="button">文件夹</button></div></div><textarea id="textDraft" rows="1" maxlength="65536" aria-label="发送消息" placeholder="发送消息…"></textarea><button id="sendText" class="send-button">发送</button></form>
<input id="files" type="file" multiple hidden><input id="folder" type="file" multiple webkitdirectory hidden>
</div>
<div id="pair" class="overlay" hidden><section class="dialog"><span class="brand">↔</span><h2>连接邻传</h2><p>输入电脑左下角二维码图标里的六位码</p><form id="pairForm"><input id="pairCode" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" aria-label="六位配对码" required><p id="pairError" class="error"></p><button class="send-button" id="pairButton">连接</button></form></section></div>
<div id="imagePreview" class="image-preview" role="dialog" aria-label="图片预览" aria-modal="true" hidden><button id="closeImage" type="button" aria-label="关闭图片">×</button><img id="imageFull" alt=""></div>
<div id="toast" role="status" hidden></div><script src="/sha256.js"></script><script src="/app.js"></script></body></html>
